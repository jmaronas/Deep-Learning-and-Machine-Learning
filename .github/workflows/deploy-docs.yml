name: Deploy book to GitHub Pages

on:
  # push:
  #   branches:
  #     - feat/create_webpage
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install TeX Live (for jupyter-tikz)
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-latex-base texlive-latex-extra texlive-pictures

      - name: Install dependencies
        run: pip install -r docs/requirements.txt

      - name: Pre-download NLP data/models
        run: |
          python -m nltk.downloader punkt punkt_tab
          python -m spacy download es_core_news_sm

      - name: Register Jupyter kernel
        run: python -m ipykernel install --user --name temario_ml

      - name: Build the book with Sphinx
        working-directory: docs
        run: make html SPHINXOPTS="-W --keep-going"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/build/html

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
